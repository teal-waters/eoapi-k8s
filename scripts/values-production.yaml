ingress:
  enabled: true
  className: "nginx"
  host: "eoapi.tealwaters.com"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: true
    secretName: eoapi-tls

serviceAccount:
  create: false
  name: "eoapi-workload-identity"

# Enable workload identity for all services
raster:
  autoscaling:
    enabled: true
    # Zoomed-out tiles can take 20-30 CPU-seconds each, so keep enough pods
    # warm to absorb the burst from a full-country view.
    minReplicas: 4
    # Each pod can open WEB_CONCURRENCY x DB_MAX_CONN_SIZE DB connections (4 x 3 = 12).
    # If this goes up, raise postgrescluster max_connections to match.
    maxReplicas: 15
    # CPU only: request-rate scaling needs prometheus-adapter (custom metrics API),
    # which isn't deployed, and an unreadable metric stops the HPA from scaling.
    type: "cpu"
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 0  # React to bursts immediately
    targets:
      cpu: 60  # Lower due to resource intensity
      requestRate: 30000m  # 30 req/sec per pod
  settings:
    labels:
      azure.workload.identity/use: "true"
    resources:
      requests:
        cpu: "1024m"
        memory: "3072Mi"
      limits:
        cpu: "2048m"
        memory: "6144Mi"
    envVars:
      AZURE_STORAGE_ACCOUNT: "tealwaters"
      # GDAL optimization
      GDAL_CACHEMAX: "512"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      GDAL_INGESTED_BYTES_AT_OPEN: "32768"
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      GDAL_HTTP_MULTIPLEX: "YES"
      GDAL_HTTP_VERSION: "2"
      GDAL_HTTP_MAX_RETRY: "3"
      GDAL_HTTP_RETRY_DELAY: "1"
      PYTHONWARNINGS: "ignore"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "5000000"
      # Uvicorn settings
      HOST: "0.0.0.0"
      PORT: "8080"
      WEB_CONCURRENCY: "4"
      TITILER_DEBUG: "False"
      # Zoomed-out tiles over the lower 48 cover up to ~400 items (zoom 3).
      # The default of 100 left blank strips where items were cut off.
      TITILER_PGSTAC_SEARCH_ITEMS_LIMIT: "400"

browser:
  ingress:
    enabled: false  # browser has its own ingress (scripts/browser-ingress.yaml) without rewrite-target
  settings:
    labels:
      azure.workload.identity/use: "true"
    envVars: 
      AZURE_STORAGE_ACCOUNT: "tealwaters"

stac:
  settings:
    labels:
      azure.workload.identity/use: "true"
    envVars:
      AZURE_STORAGE_ACCOUNT: "tealwaters"
      STAC_FASTAPI_TITLE: "The TealWaters STAC Catalog"
      STAC_FASTAPI_DESCRIPTION: >
        The STAC endpoint is served at [https://eoapi.tealwaters.com/stac](https://eoapi.tealwaters.com/stac). This interface allows users to browser through our data products, including technical metadata and other relevant information.

postgrescluster:
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          # Raster and stac connect directly, so this must exceed their combined pool maximums
          # or stac gets TooManyConnectionsError when raster scales out:
          #   raster 15 pods x 4 workers x 3 = 180 (~276 mid-rollout at 50% surge)
          #   stac    2 pods x 10 workers x 5 = 100
          max_connections: 400

pgstacBootstrap:
  settings:
    loadSamples: false

vector:
  enabled: false

multidim:
  enabled: false
